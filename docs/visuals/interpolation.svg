<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
<title id="title">Inside bdex-framegen</title><desc id="desc">Three GPU processing stages above a schematic x4 interpolation sequence with two real frames and three generated intermediate frames.</desc>
