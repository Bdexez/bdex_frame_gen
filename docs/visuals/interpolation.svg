<g fill="none" stroke="#243445" stroke-width="1" opacity="0.45"><path d="M0 0V780"/><path d="M80 0V780"/><path d="M160 0V780"/><path d="M240 0V780"/><path d="M320 0V780"/><path d="M400 0V780"/><path d="M480 0V780"/><path d="M560 0V780"/><path d="M640 0V780"/><path d="M720 0V780"/><path d="M800 0V780"/><path d="M880 0V780"/><path d="M960 0V780"/><path d="M1040 0V780"/><path d="M1120 0V780"/><path d="M1200 0V780"/><path d="M1280 0V780"/><path d="M1360 0V780"/><path d="M1440 0V780"/><path d="M1520 0V780"/><path d="M0 0H1600"/><path d="M0 80H1600"/><path d="M0 160H1600"/><path d="M0 240H1600"/><path d="M0 320H1600"/><path d="M0 400H1600"/><path d="M0 480H1600"/><path d="M0 560H1600"/><path d="M0 640H1600"/><path d="M0 720H1600"/></g><text x="64" y="70" fill="#a7f34a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">BETWEEN TWO REAL FRAMES</text><text x="64" y="129" fill="#f2f7fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Estimate motion. Synthesize the in-between.</text><rect x="64" y="174" width="450" height="135" rx="18" fill="#142332" stroke="#304755"/><text x="88" y="210" fill="#79cdd5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">01</text><text x="88" y="252" fill="#e7f1f6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">Luma pyramid</text><text x="88" y="282" fill="#9ab0bf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Multi-scale image analysis</text><rect x="575" y="174" width="450" height="135" rx="18" fill="#142332" stroke="#304755"/><text x="599" y="210" fill="#79cdd5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">02</text><text x="599" y="252" fill="#e7f1f6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">Bidirectional optical flow</text><text x="599" y="282" fill="#9ab0bf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Hierarchical block matching</text><rect x="1086" y="174" width="450" height="135" rx="18" fill="#142332" stroke="#304755"/><text x="1110" y="210" fill="#79cdd5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">03</text><text x="1110" y="252" fill="#e7f1f6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">Frame synthesis</text><text x="1110" y="282" fill="#9ab0bf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Warp, blend and handle cuts</text><path d="M525 243h34m-9-8 9 8-9 8" fill="none" stroke="#6c919d" stroke-width="2"/><path d="M1036 243h34m-9-8 9 8-9 8" fill="none" stroke="#6c919d" stroke-width="2"/><text x="64" y="376" fill="#9db4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="2">SCHEMATIC · ×4 INTERPOLATION</text><rect x="64" y="414" width="264" height="184" rx="14" fill="#0d1824" stroke="#7dd3fc" stroke-width="2"/><path d="M80 555h232M80 515h232M80 475h232" stroke="#243546"/><path d="M106 434v146" stroke="#243546"/><path d="M149 434v146" stroke="#243546"/><path d="M192 434v146" stroke="#243546"/><path d="M235 434v146" stroke="#243546"/><path d="M278 434v146" stroke="#243546"/><circle cx="112" cy="505" r="26" fill="#7dd3fc"/><text x="82" y="635" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">REAL A</text><text x="82" y="666" fill="#9eb6c7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="400">t = 0</text><rect x="366" y="414" width="264" height="184" rx="14" fill="#0d1824" stroke="#a7f34a" stroke-width="2"/><path d="M382 555h232M382 515h232M382 475h232" stroke="#243546"/><path d="M408 434v146" stroke="#243546"/><path d="M451 434v146" stroke="#243546"/><path d="M494 434v146" stroke="#243546"/><path d="M537 434v146" stroke="#243546"/><path d="M580 434v146" stroke="#243546"/><circle cx="454" cy="505" r="26" fill="#a7f34a"/><text x="384" y="635" fill="#a7f34a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">GENERATED</text><text x="384" y="666" fill="#9eb6c7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="400">t = 0.25</text><rect x="668" y="414" width="264" height="184" rx="14" fill="#0d1824" stroke="#a7f34a" stroke-width="2"/><path d="M684 555h232M684 515h232M684 475h232" stroke="#243546"/><path d="M710 434v146" stroke="#243546"/><path d="M753 434v146" stroke="#243546"/><path d="M796 434v146" stroke="#243546"/><path d="M839 434v146" stroke="#243546"/><path d="M882 434v146" stroke="#243546"/><circle cx="796" cy="505" r="26" fill="#a7f34a"/><text x="686" y="635" fill="#a7f34a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">GENERATED</text><text x="686" y="666" fill="#9eb6c7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="400">t = 0.50</text><rect x="970" y="414" width="264" height="184" rx="14" fill="#0d1824" stroke="#a7f34a" stroke-width="2"/><path d="M986 555h232M986 515h232M986 475h232" stroke="#243546"/><path d="M1012 434v146" stroke="#243546"/><path d="M1055 434v146" stroke="#243546"/><path d="M1098 434v146" stroke="#243546"/><path d="M1141 434v146" stroke="#243546"/><path d="M1184 434v146" stroke="#243546"/><circle cx="1138" cy="505" r="26" fill="#a7f34a"/><text x="988" y="635" fill="#a7f34a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">GENERATED</text><text x="988" y="666" fill="#9eb6c7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="400">t = 0.75</text><rect x="1272" y="414" width="264" height="184" rx="14" fill="#0d1824" stroke="#7dd3fc" stroke-width="2"/><path d="M1288 555h232M1288 515h232M1288 475h232" stroke="#243546"/><path d="M1314 434v146" stroke="#243546"/><path d="M1357 434v146" stroke="#243546"/><path d="M1400 434v146" stroke="#243546"/><path d="M1443 434v146" stroke="#243546"/><path d="M1486 434v146" stroke="#243546"/><circle cx="1480" cy="505" r="26" fill="#7dd3fc"/><text x="1290" y="635" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">REAL B</text><text x="1290" y="666" fill="#9eb6c7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="400">t = 1</text><text x="64" y="728" fill="#a2b6c5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Equal source intervals shown for clarity. Illustration of frame order, not a timing or quality benchmark.</text></svg>
