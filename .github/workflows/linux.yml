# Linux CI: build, unit + integration tests, and the PSNR quality eval as a
# regression gate. No GPU on the runners: the demo runs on lavapipe (Mesa's
# software Vulkan) under Xvfb; the demo scene is deterministic, so the
# measured PSNR is a stable reference point (see tools/run_eval.sh). lavapipe
# tracks the GPU baseline to within ~0.04 dB (measured 28.87 / 23.49 dB vs
# 28.91 / 23.52 on hardware, balanced preset), so the thresholds below sit
# just under it (28.0 normal / 23.0 at --speed 2) — a tight gate that still
# leaves headroom for renderer noise while catching any matcher regression.
# Every push to main, under 15 minutes; what takes longer (other
# distributions, source packages, Proton, Nix, the release archives, and
# since 2026-11-01 the Khronos validation runs, the swapchain stress run,
# the sanitizers and the fuzzing) is in compat.yml, nightly when the code
# changed, on tags and by hand.
#
# Minutes (2026-11-01, the user's request: as few Actions minutes a push as
# possible): one job instead of ten (each installed the same packages and
# built the same tree; tools/ci/linux-tests.sh runs the tests side by side),
# the compiler cache kept between runs, and no run at all for a push of
# documentation only (Markdown — README.md excepted —, docs/, the other
# workflows, the Windows scripts). Pushes to other branches run nothing: a
# pull request, or Actions -> linux -> Run workflow on that branch.
name: linux

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**"
      - "!**.md"
      - "README.md"            # (option_keys: the README's option table)
      - "!docs/**"
      - "!LICENSE"
      - "!.github/dependabot.yml"
      - "!.github/workflows/windows.yml"
      - "!.github/workflows/compat.yml"
      - "!tools/*.ps1"
      - "!capture/src/**"       # (the Windows capture app: MSVC x64 in windows.yml)
      - "!capture/CMakeLists.txt"
      - "!tests/proton/**"      # (the Wine probes: compat.yml's proton checks)
      - "!packaging/decky/package.json"
      - "!packaging/decky/pnpm-lock.yaml"
  pull_request:
    paths:  # (the same list: no YAML anchors, to keep to the plainest syntax)
      - "**"
      - "!**.md"
      - "README.md"            # (option_keys: the README's option table)
      - "!docs/**"
      - "!LICENSE"
      - "!.github/dependabot.yml"
      - "!.github/workflows/windows.yml"
      - "!.github/workflows/compat.yml"
      - "!tools/*.ps1"
      - "!capture/src/**"       # (the Windows capture app: MSVC x64 in windows.yml)
      - "!capture/CMakeLists.txt"
      - "!tests/proton/**"      # (the Wine probes: compat.yml's proton checks)
      - "!packaging/decky/package.json"
      - "!packaging/decky/pnpm-lock.yaml"
  workflow_dispatch:

# A newer push on the same branch cancels the run in progress (tags excepted:
# a release run always completes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only token by default; the jobs that publish (release, CI logs) ask
# for more themselves.
permissions:
  contents: read

jobs:
  # One job: the lanes of tools/ci/linux-tests.sh one after the other (on a
  # private repository's 2-CPU runner, tests side by side starve the pacing
  # tests — measured 2026-11-01). About 12 minutes in the CI replica on 2
  # CPUs; a new long test that would take it past 15 goes into the nightly
  # lanes (compat.yml) or a job of its own.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # (gitleaks reads the whole history)
      # The last build before the census term: the default matcher path must
      # stay byte-identical to it (AGENTS.md, invariant n°1).
      - uses: actions/checkout@v4
        with:
          ref: f2cec5f29d90775a3d1a847620058ffaccca19af
          path: baseline

      - name: Dependencies
        run: |
          tools/ci/runner-apt.sh \
            cmake g++ pkg-config glslc libvulkan-dev vulkan-tools ccache \
            mesa-vulkan-drivers libglfw3-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxext-dev openbox picom xvfb python3-numpy python3-pil vulkan-validationlayers \
            g++-mingw-w64-i686-posix

      # The runners have no GPU; force Mesa's software Vulkan (lavapipe).
      # Resolve the ICD path rather than hardcoding it — it varies across
      # runner images, and pointing VK_ICD_FILENAMES at a missing file makes
      # the loader find no driver at all, surfacing later only as a bare
      # vkCreateInstance -9 (VK_ERROR_INCOMPATIBLE_DRIVER). Verify it actually
      # loads here so a broken environment fails fast, with diagnostics.
      - name: Vulkan setup (lavapipe)
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1 || true)"
          if [ -z "$icd" ]; then
            echo "lavapipe ICD not found; installed ICDs:"
            ls -la /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "Using lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          if ! VK_ICD_FILENAMES="$icd" vulkaninfo --summary; then
            echo "=== vulkaninfo failed; loader debug ==="
            VK_ICD_FILENAMES="$icd" VK_LOADER_DEBUG=all vulkaninfo 2>&1 | head -80 || true
            exit 1
          fi

      # The compiler's output kept from one run to the next (ccache): an
      # unchanged file is not compiled again.
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Build
        run: |
          ccache -z
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBDEX_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"
          cmake -S baseline -B baseline/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build baseline/build -j"$(nproc)"
          ccache -s

      # How the tests find the layer: the runner's loader (Ubuntu 24.04:
      # 1.3.275) ignores VK_IMPLICIT_LAYER_PATH and VK_ADD_IMPLICIT_LAYER_PATH,
      # but every loader searches $XDG_DATA_HOME/vulkan/implicit_layer.d. The
      # test scripts copy the manifest of the build under test into a private
      # XDG_DATA_HOME (tools/layer_env.sh), so nothing is installed
      # system-wide — which also keeps the f2cec5f comparison honest (a
      # global layer would load for both builds). Check both facts here.
      - name: Layer discovery
        run: |
          # Capture first: under the step's `bash -eo pipefail`, `vulkaninfo |
          # grep -q` fails when grep exits early (SIGPIPE) — i.e. when it matches.
          out="$(vulkaninfo 2>/dev/null || true)"
          if grep -qi bdex <<<"$out"; then
            echo "a BDEX layer is installed system-wide on this runner"; exit 1
          fi
          xdg="$(mktemp -d)"; mkdir -p "$xdg/vulkan/implicit_layer.d"
          cp build/layer/VK_LAYER_BDEX_framegen.json "$xdg/vulkan/implicit_layer.d/"
          out="$(env -u VK_IMPLICIT_LAYER_PATH XDG_DATA_HOME="$xdg" vulkaninfo 2>/dev/null || true)"
          if ! grep -qi bdex <<<"$out"; then
            echo "=== layer not discovered through XDG_DATA_HOME ==="
            XDG_DATA_HOME="$xdg" VK_LOADER_DEBUG=all vulkaninfo 2>&1 | grep -i "bdex\|implicit\|layer" | head -40 || true
            exit 1
          fi
          echo "layer discovered through XDG_DATA_HOME"

      # Recorded game sequences (tools/corpus_pack.py), attached to the
      # repository's release named "corpus": scored by the corpus test with
      # the synthetic ones, against tests/corpus_reference.json (a sequence
      # without references is reported, not failed: add them with
      # `test_corpus.py build --update`). Skipped when there is no such release.
      - name: Recorded game corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download corpus --repo "$GITHUB_REPOSITORY" --dir corpus-archives --pattern '*.tar.gz'; then
            python3 tools/corpus_fetch.py corpus-real corpus-archives/*.tar.gz
            echo "BDEX_CORPUS_DIR=$PWD/corpus-real" >> "$GITHUB_ENV"
          else
            echo "no \"corpus\" release: recorded sequences skipped"
          fi

      # core: GPU tests without a display (bdex_offline), the f2cec5f
      # invariant, the PSNR gates; display: the demo through the layer;
      # mingw: the Windows C++ for 32-bit x86 (MSVC x64 runs in
      # windows.yml). Khronos validation over every option and the swapchain
      # stress run: nightly (compat.yml). --repeat until-pass:2 (in the
      # script) absorbs a one-off software-renderer hiccup.
      - name: Tests
        run: tools/ci/linux-tests.sh build baseline/build core display mingw

      # No secret (token, key, password) in any commit, the history included:
      # gitleaks, pinned, in a few seconds. Checked clean on 2026-10-13 (305
      # commits). A false positive goes into .gitleaksignore (its fingerprint).
      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --log-opts="--all" --redact --no-banner -v
