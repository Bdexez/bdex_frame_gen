# Linux CI: build, unit + integration tests, and the PSNR quality eval as a
# regression gate. No GPU on the runners: the demo runs on lavapipe (Mesa's
# software Vulkan) under Xvfb; the demo scene is deterministic, so the
# measured PSNR is a stable reference point (see tools/run_eval.sh). lavapipe
# tracks the GPU baseline to within ~0.04 dB (measured 28.87 / 23.49 dB vs
# 28.91 / 23.52 on hardware, balanced preset), so the thresholds below sit
# just under it (28.0 normal / 23.0 at --speed 2) — a tight gate that still
# leaves headroom for renderer noise while catching any matcher regression.
name: linux

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The last build before the census term: the default matcher path must
      # stay byte-identical to it (AGENTS.md, invariant n°1).
      - uses: actions/checkout@v4
        with:
          ref: f2cec5f29d90775a3d1a847620058ffaccca19af
          path: baseline

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config glslc libvulkan-dev vulkan-tools \
            mesa-vulkan-drivers libglfw3-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxext-dev xvfb python3-numpy python3-pil vulkan-validationlayers

      # The runners have no GPU; force Mesa's software Vulkan (lavapipe).
      # Resolve the ICD path rather than hardcoding it — it varies across
      # runner images, and pointing VK_ICD_FILENAMES at a missing file makes
      # the loader find no driver at all, surfacing later only as a bare
      # vkCreateInstance -9 (VK_ERROR_INCOMPATIBLE_DRIVER). Verify it actually
      # loads here so a broken environment fails fast, with diagnostics.
      - name: Vulkan setup (lavapipe)
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1 || true)"
          if [ -z "$icd" ]; then
            echo "lavapipe ICD not found; installed ICDs:"
            ls -la /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "Using lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          if ! VK_ICD_FILENAMES="$icd" vulkaninfo --summary; then
            echo "=== vulkaninfo failed; loader debug ==="
            VK_ICD_FILENAMES="$icd" VK_LOADER_DEBUG=all vulkaninfo 2>&1 | head -80 || true
            exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBDEX_WERROR=ON

      - name: Build
        run: |
          cmake --build build -j
          cmake -S baseline -B baseline/build -DCMAKE_BUILD_TYPE=Release
          cmake --build baseline/build -j

      # How the tests find the layer: the runner's loader (Ubuntu 24.04:
      # 1.3.275) ignores VK_IMPLICIT_LAYER_PATH and VK_ADD_IMPLICIT_LAYER_PATH,
      # but every loader searches $XDG_DATA_HOME/vulkan/implicit_layer.d. The
      # test scripts copy the manifest of the build under test into a private
      # XDG_DATA_HOME (tools/layer_env.sh), so nothing is installed
      # system-wide — which also keeps the f2cec5f comparison below honest
      # (a global layer would load for both builds). Check both facts here.
      - name: Layer discovery
        run: |
          # Capture first: under the step's `bash -eo pipefail`, `vulkaninfo |
          # grep -q` fails when grep exits early (SIGPIPE) — i.e. when it matches.
          out="$(vulkaninfo 2>/dev/null || true)"
          if grep -qi bdex <<<"$out"; then
            echo "a BDEX layer is installed system-wide on this runner"; exit 1
          fi
          xdg="$(mktemp -d)"; mkdir -p "$xdg/vulkan/implicit_layer.d"
          cp build/layer/VK_LAYER_BDEX_framegen.json "$xdg/vulkan/implicit_layer.d/"
          out="$(env -u VK_IMPLICIT_LAYER_PATH XDG_DATA_HOME="$xdg" vulkaninfo 2>/dev/null || true)"
          if ! grep -qi bdex <<<"$out"; then
            echo "=== layer not discovered through XDG_DATA_HOME ==="
            XDG_DATA_HOME="$xdg" VK_LOADER_DEBUG=all vulkaninfo 2>&1 | grep -i "bdex\|implicit\|layer" | head -40 || true
            exit 1
          fi
          echo "layer discovered through XDG_DATA_HOME"

      # Unit tests run headless; the integration test (demo through the
      # layer, checks the doubled frame rate) needs a display, hence Xvfb.
      # --repeat until-pass:2 absorbs a one-off software-renderer hiccup.
      - name: Tests
        run: BDEX_REQUIRE_DISPLAY=1 xvfb-run -a ctest --test-dir build --output-on-failure --repeat until-pass:2

      # Default generated frames must match the pre-census build byte for byte.
      # Each run loads only its own build's layer (private XDG_DATA_HOME, and
      # nothing installed system-wide — checked in "Layer discovery").
      - name: Matcher invariant (bit-for-bit vs f2cec5f)
        run: |
          BDEX_INVARIANT_SEQUENTIAL=1 xvfb-run -a -s '-screen 0 1280x800x24' \
            python3 tests/check_matcher_invariant.py build baseline/build

      # Quality regression gate: PSNR of the generated frames against the
      # 60 fps ground truth, normal and fast-motion scenes.
      - name: Quality eval
        run: |
          normal="$(xvfb-run -a tools/run_eval.sh build 40 | awk '/^  mean/{print $2; exit}')"
          fast="$(xvfb-run -a env BDEX_EVAL_ARGS='--speed 2' tools/run_eval.sh build 40 | awk '/^  mean/{print $2; exit}')"
          echo "PSNR normal: ${normal} dB, fast: ${fast} dB"
          python3 - "$normal" "$fast" <<'EOF'
          import sys
          normal, fast = float(sys.argv[1]), float(sys.argv[2])
          failures = []
          if normal < 28.0: failures.append(f"normal {normal:.2f} < 28.0 dB")
          if fast < 23.0:   failures.append(f"fast {fast:.2f} < 23.0 dB")
          if failures:
              print("quality regression:", "; ".join(failures)); sys.exit(1)
          EOF
          # x3/x4 score every generated position (local reference on llvmpipe:
          # 31.81/31.98 dB at 800x600); same 28 dB floor, shorter runs.
          for mult in 3 4; do
            report="$(BDEX_FG_MULTIPLIER=$mult xvfb-run -a tools/run_eval.sh build 12)"
            echo "$report"
            echo "$report" | awk '/^  mean/ { seen=1; if ($2 < 28) bad=1 } END { exit !seen || bad }'
          done

      # Recorded game sequences (tools/corpus_pack.py), attached to the
      # repository's release named "corpus": scored like the synthetic corpus
      # against tests/corpus_reference.json (a sequence without references is
      # reported, not failed: add them with `test_corpus.py build --update`).
      # Skipped when there is no such release.
      - name: Recorded game corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download corpus --repo "$GITHUB_REPOSITORY" --dir corpus-archives --pattern '*.tar.gz'; then
            python3 tools/corpus_fetch.py corpus-real corpus-archives/*.tar.gz
            BDEX_CORPUS_DIR=corpus-real python3 tests/test_corpus.py build
          else
            echo "no \"corpus\" release: recorded sequences skipped"
          fi

  # The layer and the demo built with ASan+UBSan, then with TSan, running the
  # GPU tests on lavapipe (the swapchain virtualisation has a worker thread,
  # three mutexes and condition variables). The tests load the build's layer
  # through a private XDG_DATA_HOME (tools/layer_env.sh); nothing is
  # installed globally here.
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            env: "ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1"
          - name: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer"
            env: "TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1:suppressions=$GITHUB_WORKSPACE/tests/tsan.supp"
    name: sanitizers (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config glslc libvulkan-dev vulkan-tools \
            mesa-vulkan-drivers libglfw3-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxext-dev xvfb python3-numpy python3-pil
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
          cmake --build build -j
      - name: GPU tests under the sanitizer
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          out="$(vulkaninfo 2>/dev/null || true)"   # not piped into grep -q (pipefail + SIGPIPE)
          if grep -qi bdex <<<"$out"; then
            echo "an installed BDEX layer would shadow the sanitized build"; exit 1
          fi
          env ${{ matrix.env }} VK_ICD_FILENAMES="$icd" BDEX_REQUIRE_DISPLAY=1 \
            xvfb-run -a -s '-screen 0 1280x800x24' \
            ctest --test-dir build -R "unit|offline|integration|acquire" --output-on-failure

  # The Windows C++ (layer, unit tests, capture app except its C++/WinRT
  # file) compiled with MinGW for x64 and 32-bit x86, syntax only: reports
  # in a minute what the MSVC jobs (windows.yml) would fail on — the Win32
  # handle casts, the capture target's include order — so both kinds of
  # breakage surface on every push, next to the Linux results.
  # The parsers (configuration and profiles, status files, options_ui.conf,
  # online_tune cache) under libFuzzer + ASan + UBSan, from the seed corpus,
  # a minute each. A failing input is uploaded; commit it to
  # tests/fuzz/corpus/<target>/ with the fix (every build replays them).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake clang libclang-rt-18-dev glslc libvulkan-dev
      - name: Fuzz
        run: tools/ci/fuzz.sh 60
      - name: Failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: tests/fuzz/corpus/*/crash-*

  windows-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config glslc libvulkan-dev \
            g++-mingw-w64-x86-64-posix g++-mingw-w64-i686-posix
      - name: MinGW syntax check (x64, x86)
        run: tools/ci/mingw/check.sh

  # Builds from source in other distributions' containers — their own
  # compiler, CMake, Vulkan headers and shader compiler (glslc or
  # glslangValidator) — and runs the tests that need no GPU.
  distros:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, debian:12, fedora:latest, archlinux:latest, opensuse/tumbleweed, alpine:latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (${{ matrix.image }})
        run: tools/ci/distro-check.sh "${{ matrix.image }}"

  # The distributions' own source packages, built from this checkout as their
  # build services would (COPR / OBS spec, Debian source package for a PPA,
  # Gentoo ebuild, Void template, Flathub extension), 32-bit layer included
  # where the distribution packages it, then installed and checked.
  source-packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [srpm-check, debsrc-check, gentoo-check, void-check, flatpak-check, lib32-check, proton-check, proton-wayland-check]
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.check }}
        run: tools/ci/${{ matrix.check }}.sh

  # The control panel in containers, on a virtual display: GTK 4 with and
  # without libadwaita, and its text mode where GTK 4 is missing (Ubuntu
  # 20.04).
  panel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Options description (options_ui.json)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++ glslc libvulkan-dev
          cmake -S . -B build -DBDEX_BUILD_TESTS=OFF -DBDEX_BUILD_DEMO=OFF -DBDEX_BUILD_OFFLINE=OFF
          cmake --build build --target bdex_options_ui -j"$(nproc)"
      - name: Panel (Ubuntu 20.04, Debian 12, Arch)
        run: tools/ci/panel-check.sh build/options_ui.json ubuntu:20.04 debian:12 archlinux:latest

  # NixOS: the flake's packages (64-bit, and the 32-bit layer) build and the
  # layer loads with the store's Vulkan loader.
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: |
          nix build .#default .#layer32 -L
          mesa="$(nix build --no-link --print-out-paths nixpkgs#mesa | head -1)"
          out="$(XDG_DATA_DIRS="$PWD/result/share" BDEX_FG=1 BDEX_FG_LOG=2 \
            VK_ICD_FILENAMES="$(ls "$mesa"/share/vulkan/icd.d/lvp_icd*.json | head -1)" \
            nix shell nixpkgs#vulkan-tools -c vulkaninfo --summary 2>&1 || true)"
          grep -E 'bdex-fg.*loaded' <<<"$out"

  # The prebuilt archives: the SPIR-V compiled by glslc (as tested above),
  # the layers linked on Ubuntu 20.04 (glibc 2.31, GCC 10, static C++
  # runtime) for x86_64 (64 and 32-bit) and arm64 — they load on every
  # distribution from 2020 on. tools/ci/package-release.sh, in Docker. Each
  # archive is then installed as a user would on older and newer
  # distributions, where it must load and generate (tools/ci/archive-check.sh).
  # Every push keeps them as an artifact; a v* tag attaches them to the GitHub
  # release (windows.yml attaches the Windows zips to the same release).
  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          tools/ci/package-release.sh dist "$version"
          # The same files as .deb and .rpm (x86_64 and aarch64).
          for a in dist/bdex-framegen-linux-*.tar.gz; do tools/package-native.sh "$a" dist "$version"; done
          # The Steam Deck's quick access menu (Decky Loader plugin).
          tools/ci/decky-check.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: bdex-framegen-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zip
          if-no-files-found: error
      # Mesa's software Vulkan and Xvfb in each container (arm64: Debian arm64
      # under qemu-user): the layer loads with that glibc and loader, and
      # generates x2 through vkcube. A failure keeps the archives out of the
      # release.
      - name: Check the archives on other distributions
        run: |
          tools/ci/archive-check.sh dist/bdex-framegen-linux-x86_64*.tar.gz \
            ubuntu:20.04 debian:11 ubuntu:22.04 debian:12 ubuntu:24.04 fedora:latest
          tools/ci/archive-check.sh dist/bdex-framegen-linux-aarch64*.tar.gz bullseye bookworm
          tools/ci/archive-check.sh dist/bdex-framegen_*_amd64.deb ubuntu:20.04 ubuntu:22.04 debian:12 ubuntu:24.04
          tools/ci/archive-check.sh dist/bdex-framegen-*.x86_64.rpm fedora:latest opensuse/tumbleweed
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
