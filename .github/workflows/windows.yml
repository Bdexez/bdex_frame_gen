# Windows build of both products: the Vulkan layer (mode 1, x64 + Win32) and
# the capture PoC bdex_capture.exe (mode 2, x64). There is no Windows machine
# in the development environment, so this job is the MSVC build the docs'
# validation checklists start with. Artifacts: one zip per architecture;
# register-layer.ps1 generates the per-user manifest when installed.
name: windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push on the same branch cancels the run in progress (tags excepted:
# a release run always completes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only token by default; the jobs that publish (release, CI logs) ask
# for more themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write   # the ci-log-<arch> branches (see the last step)
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4

      # The SDK (download + installer: minutes) is cached by version; the
      # checksum is checked when it is downloaded.
      - name: Vulkan SDK cache
        id: vksdk
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\1.4.357.0
          key: vulkan-sdk-1.4.357.0-${{ runner.os }}

      - name: Install Vulkan SDK
        shell: pwsh
        env:
          CACHED: ${{ steps.vksdk.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.357.0'
          $sdk = "C:\VulkanSDK\$version"
          if ($env:CACHED -eq 'true' -and (Test-Path "$sdk\Bin\glslc.exe")) {
            "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
            "$sdk\Bin" >> $env:GITHUB_PATH
            Write-Host "Vulkan SDK at $sdk (cache)"
            exit 0
          }
          $expectedSha256 = '81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d'
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan_sdk.exe
          $actualSha256 = (Get-FileHash .\vulkan_sdk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Vulkan SDK checksum mismatch: $actualSha256" }
          $installer = Start-Process -Wait -PassThru -FilePath .\vulkan_sdk.exe -ArgumentList @(
            '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($installer.ExitCode -ne 0) { throw "Vulkan SDK installer failed: $($installer.ExitCode)" }
          $sdk = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "Vulkan SDK glslc missing at $sdk" }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK at $sdk"

      # Every step below tees its output into logs/ so a failed run can be
      # read without GitHub credentials (see the last step). Tee-Object hides
      # the native exit code, hence the explicit $LASTEXITCODE checks.
      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
            -DBDEX_BUILD_DEMO=OFF -DBDEX_BUILD_TESTS=ON -DBDEX_WERROR=ON 2>&1 | Tee-Object -FilePath logs/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath logs/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish logs on failure
        if: failure()
        shell: pwsh
        run: |
          # Job logs need repository admin rights through the API; the
          # development environment has none, so a failed run pushes its logs
          # to an orphan ci-log-<arch> branch readable with plain git.
          "## Errors (${{ matrix.arch }}, commit ${{ github.sha }})" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem logs/*.log | ForEach-Object {
            Select-String -Path $_ -Pattern 'error [A-Z]+[0-9]+|error:|fatal error|CMake Error' |
              ForEach-Object { $_.Line } | Select-Object -First 60
          } >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build/CMakeFiles/CMakeConfigureLog.yaml) {
            Copy-Item build/CMakeFiles/CMakeConfigureLog.yaml logs/
          }
          cd logs
          git init -q
          git checkout -q -b ci-log-${{ matrix.arch }}
          git config user.email "ci@bdex"
          git config user.name "ci"
          git add .
          git commit -q -m "logs of run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-log-${{ matrix.arch }}

      # Authenticode (our binaries only, not DXVK / VKD3D-Proton): on tags and
      # manual runs, once the certificate is in the repository's secrets —
      # WINDOWS_SIGN_PFX_BASE64 (the .pfx, base64) and WINDOWS_SIGN_PFX_PASSWORD.
      # Without them the step does nothing. The secrets reach this step only.
      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { "no signing certificate in the secrets: binaries left unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName | Select-Object -Last 1
            $files = @("build/layer/Release/VkLayer_bdex_framegen.dll", "build/capture/Release/bdex_capture.exe",
                       "build/tools/calibrate/Release/bdex-calibrate.exe") | Where-Object { Test-Path $_ }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $files
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa $files
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force $pfx
          }

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/bdex-framegen-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/layer/Release/VkLayer_bdex_framegen.dll $out
          if (Test-Path build/capture/Release/bdex_capture.exe) {
            Copy-Item build/capture/Release/bdex_capture.exe $out
          }
          if (Test-Path build/tools/calibrate/Release/bdex-calibrate.exe) {
            Copy-Item build/tools/calibrate/Release/bdex-calibrate.exe $out
          }
          Copy-Item tools/register-layer.ps1, tools/unregister-layer.ps1, tools/validate-windows.ps1 $out
          Copy-Item layer/profiles.conf $out   # per-game profiles, read next to the DLL / exe
          Copy-Item docs/windows-port.md, docs/windows-capture.md, docs/windows-README.md $out
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $out
          if ('${{ matrix.arch }}' -eq 'x64') {
            # DXVK / VKD3D-Proton: the launcher's injection into Direct3D
            # games (capture/src/injection.h), pinned and checked.
            python -m pip install --quiet zstandard
            python tools/fetch_translation_layers.py $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem -Recurse $out

      - uses: actions/upload-artifact@v4
        with:
          name: bdex-framegen-windows-${{ matrix.arch }}
          path: dist/bdex-framegen-windows-${{ matrix.arch }}
          if-no-files-found: error

  # The package to give users: the x64 one with the 32-bit layer in x86\
  # (the launcher registers both: 32-bit games inject too).
  bundle:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Bundle
        run: |
          set -e
          out=dist/bdex-framegen-windows-complete
          cp -r dist/bdex-framegen-windows-x64 "$out"
          mkdir -p "$out/x86"
          cp dist/bdex-framegen-windows-Win32/VkLayer_bdex_framegen.dll "$out/x86/"
          ls -R "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: bdex-framegen-windows-complete
          path: dist/bdex-framegen-windows-complete
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip
        run: |
          cd dist
          for d in bdex-framegen-windows-*; do (cd "$d" && zip -r "../$d.zip" .); done
          ls -l *.zip
      # The package ships VKD3D-Proton (LGPL-2.1): its complete source goes on
      # the same release page (section 4), submodules included.
      - name: VKD3D-Proton source
        run: python3 tools/fetch_translation_layers.py --source dist
      - name: Checksums
        run: cd dist && sha256sum *.zip vkd3d-proton-*-source.tar.gz | tee SHA256SUMS-windows.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2 (third party, with write access: pinned)
        with:
          files: |
            dist/*.zip
            dist/vkd3d-proton-*-source.tar.gz
            dist/SHA256SUMS-windows.txt
          prerelease: ${{ contains(github.ref_name, '-') }}   # v0.4.0-pre1 → pre-release
          generate_release_notes: true
