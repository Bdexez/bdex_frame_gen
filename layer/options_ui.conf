# The option controls of the GTK panel (tools/bdex-framegen-gui) and of the
# Windows launcher (capture/src/launcher.cpp), both built from this file:
# the texts are here; the kind, range and default come from the option
# registry of layer/src/config.cpp (Config::optionInfo), so a new option is
# a registry line plus a line here — and the option_keys test checks both.
#
#   section | id | title | subtitle | expanded | surfaces
#   <kind>  | key | label | help | params | surfaces
#
# kinds: switch, spin, choice, text. params (';'-separated, all optional):
#   lo=, hi= (a narrower range for the UI than the registry's), step=,
#   digits=, default= (options with a syntax of their own, e.g. "auto"
#   = -1, have no registry default), choices=value:Label/value:Label
# surfaces: gui, launcher (comma-separated; empty = the section's).


section | cadence | Cadence | Limite de FPS, multiplicateur automatique, régularité | 0 | gui,launcher
spin | fps_limit | Limite d'images du jeu | Plafonne les FPS du jeu (0 = aucune). Une base stable qui divise le taux de rafraîchissement (60 → 120 Hz, 72 → 144 Hz) donne la génération la plus régulière. −1 = auto : rafraîchissement mesuré ÷ multiplicateur (écrans à fréquence fixe). | lo=-1;hi=360;step=1;digits=0;default=0 | gui
spin | target_fps | Multiplicateur automatique — cible | Taux de rafraîchissement visé (ex. 144) : le multiplicateur s'adapte aux FPS du jeu (72 → ×2, 50 → ×3, ×1 quand le jeu atteint la cible), sans dépasser le multiplicateur choisi. 0 = multiplicateur fixe ; −1 = auto (rafraîchissement mesuré). | lo=-1;hi=360;step=1;digits=0;default=0 | gui
switch | present_feedback | Mesure de l'affichage réel | Mesure quand chaque image s'affiche vraiment (si le pilote le permet) : rafraîchissement, images écrasées, cadence calée sur l'écran. |  | gui
switch | frame_timing | Suivre le temps réel des images | Place chaque image générée selon l'instant réel des images du jeu plutôt qu'à intervalle fixe : moins de saccades quand le temps d'image varie. Peut coûter un peu sur les jeux à pas de simulation fixe. |  | 
switch | dedup | Détecter les images répétées | Repère les images que le jeu présente deux fois (cinématiques à 30 i/s, émulateurs) : garde le mouvement précédent et ne fige plus l'image. Pris en compte au lancement du jeu. |  | 
spin | gpu_budget | Budget GPU de la génération | Part du temps d'image du jeu que la génération peut prendre (0,25 = un quart) ; au-delà la qualité baisse par paliers, puis remonte. 0 = désactivé. | lo=0;hi=1;step=0.05;digits=2 | gui
switch | pacing | Espacement régulier des images | Répartit les images générées dans l'intervalle du jeu (hors vsync FIFO). |  | gui
switch | sync_present | Présentation synchrone (compatibilité) | Bloque le jeu jusqu'à l'affichage de chaque image. Pour certains jeux Direct3D 12 (VKD3D-Proton) qui se figent ; ajoute de la latence. |  | gui

section | motion | Qualité du mouvement | Stabilité, contours, sous-pixel, coupures de scène… | 1 | gui,launcher
switch | online_tune | Réglage automatique par jeu | Pendant les premières secondes de jeu, essaie les options de mouvement et de synthèse sur le jeu lui-même (en notant la prédiction de l'image suivante, la stabilité du mouvement et des images synthétisées à l'aveugle), garde celles qui aident et s'en souvient pour ce jeu ; recommence si le contenu change nettement. Les options réglées à la main ne sont pas touchées. Pris en compte au lancement du jeu. |  | 
spin | zero_bias_contrast | Stabilité adaptée au contraste | Rend la stabilité de l'image fixe relative au contraste : supprime les fondus fantômes sur les décors doux en mouvement rapide, sans déstabiliser le HUD. 0 = désactivé ; 0,02 par défaut. | lo=0;hi=0.5;step=0.01;digits=2 | 
switch | pixel_vectors | Contours d'objets | Choisit le mouvement pixel par pixel aux frontières d'objets : moins de bavures, synthèse ~2× plus coûteuse. |  | 
switch | subpixel | Mouvement sous-pixel | Affine le mouvement au-delà du pixel entier. |  | 
switch | reveal_fill | Extrapolation : zones révélées | Là où un objet en mouvement découvre le décor, prend le fond plutôt que l'objet (celui des deux candidats qui bouge le moins). Gagne sur la plupart des scènes, perd un peu sur la démo. |  | 
spin | hud_mask | Masque de HUD appris | Apprend, pendant les mouvements de caméra, les pixels qui ne changent jamais (HUD, mini-carte, réticule) et les garde tels quels dans les images générées. Nombre d'images stables requis ; 24 conseillé, 0 = désactivé. Activation prise en compte au lancement du jeu. | lo=0;hi=200;step=1;digits=0 | 
spin | subpixel_lk | Sous-pixel précis (Lucas-Kanade) | Affine chaque vecteur par Lucas-Kanade (nombre d'itérations, 2 conseillé) ; ~0,1 ms. En interpolation, à combiner avec l'échantillonnage bicubique. 0 = désactivé. | lo=0;hi=4;step=1;digits=0 | 
switch | synth_bicubic | Échantillonnage bicubique | La synthèse lit les images en Catmull-Rom au lieu de bilinéaire : garde le détail quand le mouvement tombe entre deux pixels (à combiner avec le sous-pixel). ~0,6 ms. |  | 
spin | grad_weight | Netteté du mouvement rapide | Cale le suivi sur les contours plutôt que la seule luminosité : réduit le déchirement en mouvement rapide, au prix d'un peu de fidélité sur l'image fixe. 0 = désactivé ; essayer 1. | lo=0;hi=3;step=0.1;digits=1 | gui
spin | smoothness | Lissage du mouvement | Régularise le champ de mouvement (pénalise les écarts entre blocs voisins). Défaut 0,004. | lo=0;hi=0.03;step=0.001;digits=3 | gui
spin | zero_bias | Stabilité de l'image fixe | Favorise l'absence de mouvement pour garder le HUD parfaitement stable. Défaut 0,002. | lo=0;hi=0.02;step=0.001;digits=3 | gui
spin | search_fine | Précision de recherche | Rayon de recherche fin autour de la prédiction (plus haut = mouvements plus fins, plus coûteux). Défaut 2. | lo=1;hi=4;step=1;digits=0 | gui
spin | flow_iterations | Itérations de synthèse | Raffinements de la recherche du mouvement lors de l'interpolation. Défaut 1. | lo=0;hi=3;step=1;digits=0 | gui
spin | chroma_weight | Couleur dans la recherche du mouvement | Voit les contours entre couleurs de même luminosité (rouge sur vert…), qui sinon se fondent. 0 = désactivé ; essayer 1. Pris en compte au lancement du jeu. | lo=0;hi=8;step=0.5;digits=1 | 
switch | scene_cut_local | Coupure de scène par zone | Décide le repli sur l'image réelle zone par zone : un menu qui s'ouvre sur une partie de l'écran n'est plus déformé. |  | 
spin | scene_cut_low | Coupure de scène — début du fondu | Coût de mouvement moyen au-delà duquel on commence à fondre vers l'image réelle. Défaut 0,05. | lo=0;hi=0.3;step=0.01;digits=2 | gui
spin | scene_cut_high | Coupure de scène — image réelle | Coût au-delà duquel l'image générée est remplacée par une vraie image dupliquée. Défaut 0,09. | lo=0;hi=0.5;step=0.01;digits=2 | gui

section | experimental | Expérimental | Options en cours d'évaluation | 1 | gui,launcher
spin | upscale_temporal | Upscaling temporel | Avec une échelle de rendu < 1 et la génération active : les images générées sont calculées à partir des images réelles déjà upscalées (plus nettes), et l'upscale accumule un peu l'image précédente le long du mouvement. 0 = désactivé ; 0,05 conseillé (au-delà de 0,1 l'accumulation floute, faute de jitter du jeu). Pris en compte au lancement du jeu. | lo=0;hi=0.95;step=0.05;digits=2 | 
switch | extrapolate_splat | Extrapolation par projection | En mode extrapolation : projette les pixels vers leur position future (moins d'images doubles et de bavures), ~0,8 ms de plus. |  | 
spin | static_guard | Protection du HUD statique | Garde tels quels les pixels identiques dans les deux images quand le mouvement autour bouge (glyphes du HUD). Peut effacer de petits objets très rapides. 0 = désactivé. | lo=0;hi=1;step=0.1;digits=1 | 
switch | temporal_prediction | Prédiction temporelle | Cherche le mouvement autour de celui de l'image précédente : suit les panoramiques très rapides (surtout avec « Stabilité adaptée au contraste »). |  | 
spin | occlusion_strength | Gestion des occlusions | Confiance aller/retour du mouvement dans la synthèse. 0 = désactivé. | lo=0;hi=1;step=0.1;digits=1 | 
spin | rot_weight | Rotation / zoom | Réévalue les correspondances ambiguës sous rotation et mise à l'échelle. 0 = désactivé, 1 = activé. | lo=0;hi=1;step=1;digits=0 | 
spin | census_weight | Recherche par structure (census) | Départage les correspondances ambiguës par la structure locale. 0 = désactivé. | lo=0;hi=8;step=0.1;digits=1 | 
spin | census_margin | Seuil d'ambiguïté (census) | Écart relatif en dessous duquel une correspondance est jugée ambiguë. Défaut 0,05. | lo=0;hi=1;step=0.01;digits=2 | 
spin | extrapolate_accel | Extrapolation : accélération | Prédit des trajectoires courbes (caméra qui accélère, freine ou se retourne) au lieu d'une vitesse constante. 0 = désactivé, 1 = plein effet. | lo=0;hi=1;step=0.1;digits=1 | 
spin | flow_temporal | Stabilisation temporelle du mouvement | Garde le mouvement de la paire précédente là où il explique aussi bien la nouvelle paire (zones plates, textures répétées) : moins de scintillement. 0 = désactivé, 1 = conseillé. | lo=0;hi=1;step=0.1;digits=1 | 
spin | extrapolate_hold | Extrapolation : figer les pixels incertains | 1 = ancien comportement (images doubles). 0 = suivre le mouvement partout. | lo=0;hi=1;step=0.1;digits=1 | 

section | flow | Structure du flux | Résolution et pyramide du calcul du mouvement — désactive l'auto-réglage | 1 | gui,launcher
choice | flow_scale | Résolution du flux | Diviseur de résolution du calcul du mouvement ; « Auto » vise ~0,5 Mpixel. | choices=auto:Auto/1:Pleine (1)/2:Moitié (2)/4:Quart (4);default=auto | 
spin | levels | Niveaux de pyramide | Plus de niveaux = mouvements plus amples suivis. Défaut 4. | lo=1;hi=6;step=1;digits=0 | 
spin | search_radius | Rayon de recherche grossier | Rayon de recherche au niveau le plus grossier. Défaut 4. | lo=1;hi=4;step=1;digits=0 | 
switch | refine | Raffinement 4×4 | Meilleurs contours du mouvement ; coûte du temps GPU. |  | 
switch | refine_all | Raffiner tous les niveaux | Désactivé : seulement le plus fin (moins cher, ~2 dB moins bon). |  | 
spin | refine_bias | Préférence pour le mouvement du bloc | Bonus pour garder le mouvement propre d'un bloc lors du raffinement. Défaut 0,5. | lo=0;hi=5;step=0.1;digits=1 | 

section | diagnostic | Diagnostic | Journal, statistiques, profilage, captures d'images | 0 | gui,launcher
choice | debug | Mode de débogage | Flux : colore le mouvement estimé. Écran partagé : moitié générée / moitié réelle. Transparent : aucune génération (isole un problème). | choices=none:Aucun/flow:Flux/split:Écran partagé/passthrough:Transparent;default=none | 
choice | log | Verbosité du journal |  | choices=0:Silencieux (0)/1:Avertissements (1)/2:Infos (2)/3:Débogage (3);default=1 | gui
text | log_file | Fichier journal | Chemin du fichier de log (vide = sortie standard). ~ accepté. | default= | gui
switch | stats | Statistiques de FPS dans le journal |  |  | gui
spin | stats_interval | Intervalle des statistiques (s) |  | lo=0.5;hi=60;step=0.5;digits=1 | gui
switch | profile | Profilage GPU | Temps GPU par étape, avec les statistiques. |  | gui
text | dump | Dossier de capture d'images | Écrit les images présentées en PPM dans ce dossier (vide = désactivé). À éviter dans /tmp. | default= | gui
spin | dump_frames | Nombre d'images capturées |  | lo=1;hi=100000;step=1;digits=0 | gui

section | compat | Compatibilité | Réglages de secours pour les jeux récalcitrants | 0 | gui
switch | hide_present_ext | Masquer les extensions de présentation | Cache swapchain_maintenance1 / present_id au jeu (nécessaire pour VKD3D-Proton). |  | 
switch | shared_queue | File GPU partagée avec le jeu | Force le layer à partager la file du jeu (test / pilotes sans file libre). |  | 

section | capture | Capture Windows | Réglages propres à l'app de capture | 0 | launcher
choice | capture_hdr | Couleur HDR (écrans HDR) | Auto : HDR (scRGB) quand l'écran du jeu est en HDR. | choices=auto:Auto (selon l'écran)/0:Toujours SDR/1:HDR si possible;default=auto | 
