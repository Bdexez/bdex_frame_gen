# The option controls of the GTK panel (tools/bdex-framegen-gui) and of the
# Windows launcher (capture/src/launcher.cpp), both built from this file:
# the texts are here; the kind, range and default come from the option
# registry of layer/src/config.cpp (Config::optionInfo), so a new option is
# a registry line plus a line here — and the option_keys test checks both.
#
#   section | id | title | subtitle | expanded | surfaces
#   <kind>  | key | label | help | params | surfaces
#
# kinds: switch, spin, choice, text. params (';'-separated, all optional):
#   lo=, hi= (a narrower range for the UI than the registry's), step=,
#   digits=, default= (options with a syntax of their own, e.g. "auto"
#   = -1, have no registry default), choices=value:Label/value:Label
# surfaces: gui, launcher (comma-separated; empty = the section's).


section | cadence | Cadence | Limite de FPS, multiplicateur automatique, régularité | 0 | gui,launcher
spin | fps_limit | Limite d'images du jeu | Plafonne les FPS du jeu (0 = aucune). Une base stable qui divise le taux de rafraîchissement (60 → 120 Hz, 72 → 144 Hz) donne la génération la plus régulière. −1 = auto : rafraîchissement mesuré ÷ multiplicateur (écrans à fréquence fixe). | lo=-1;hi=360;step=1;digits=0;default=0 | gui
spin | target_fps | Multiplicateur automatique — cible | Taux de rafraîchissement visé (ex. 144) : le plus grand multiplicateur qui ne dépasse pas la cible (sur 144 : 72 → ×2, 50 → ×2, 48 → ×3, 36 → ×4, ×1 dès 74), sans dépasser le multiplicateur choisi. 0 = multiplicateur fixe ; −1 = auto (fréquence de l'écran). Le choix « Auto » du multiplicateur règle −1. | lo=-1;hi=360;step=1;digits=0;default=0 | gui
switch | x11_clock | Horloge d'affichage X11 | Fenêtres X11, dont tous les jeux Proton sous Wayland (Xwayland) : la cadence de l'écran est lue auprès du serveur X (événements Present), là où la mesure de l'affichage n'en trouve pas. Les images sont alors présentées pour les vrais rafraîchissements du compositeur plutôt que sur une grille à nous. Activé par défaut ; prise en compte au lancement du jeu. |  | gui
switch | present_timing | Horodatage de l'affichage par le pilote | Avec la mesure de l'affichage réel : l'instant où chaque image apparaît, daté par le pilote (VK_EXT_present_timing, s'il l'a), et la durée exacte d'un rafraîchissement — plus précis que l'heure de réveil d'un fil d'attente. Activé par défaut. |  | gui
switch | present_feedback | Mesure de l'affichage réel | Mesure quand chaque image s'affiche vraiment (si le pilote le permet) : rafraîchissement, images écrasées, cadence calée sur l'écran. |  | gui
switch | frame_timing | Suivre le temps réel des images | Place chaque image générée selon l'instant réel des images du jeu plutôt qu'à intervalle fixe : moins de saccades quand le temps d'image varie. Peut coûter un peu sur les jeux à pas de simulation fixe. |  | 
switch | dedup | Détecter les images répétées | Repère les images que le jeu présente deux fois (cinématiques à 30 i/s, émulateurs) : garde le mouvement précédent et ne fige plus l'image. Pris en compte au lancement du jeu. |  | 
spin | gpu_budget | Budget GPU de la génération | Part du temps d'image du jeu que la génération peut prendre (0,25 = un quart) ; au-delà la qualité baisse par paliers, puis remonte. 0 = désactivé. | lo=0;hi=1;step=0.05;digits=2 | gui
spin | max_frame_latency | Latence maximale (images d'avance) | Nombre d'images que le GPU peut encore traiter quand le jeu commence la suivante, comme le « mode faible latence » des pilotes : 1 = le jeu attend que le GPU ait fini l'image précédente avant de lire ses commandes. Réduit fortement l'input lag des jeux limités par le GPU (mesuré : −28 %), sans perte de FPS mesurée. 1 par défaut ; 0 = aucune limite. | lo=0;hi=3;step=1;digits=0 | gui
switch | skip_fast | Pas de génération quand c'est inutile | Avec un multiplicateur fixe : dès que le jeu atteint 85 % de la fréquence de l'écran (130 i/s sur 144 Hz), la génération se met en veille — elle n'ajouterait presque aucune image à l'écran, seulement du travail GPU et de la latence — et reprend sous 75 %. Sans effet si la fréquence de l'écran est inconnue. Activé par défaut. |  | gui
choice | refresh_fill | Remplir chaque rafraîchissement | Interpolation par la couche, écran à fréquence fixe : suit la fréquence de l'écran avec le nombre d'images nécessaire, dans la limite des sorties disponibles. À 30 i/s sur 144 Hz : alterne ×4 et ×5 ; autour de 36–37 i/s : ×3 et ×4, pour ne pas dépasser l'écran et écraser des images. Le multiplicateur choisi est un plafond, augmenté d'une sortie si nécessaire (8 au maximum). Inactif si moins de deux sorties par image du jeu suffisent, ou si le plafond ne remplit pas l'écran. | choices=0:Non/1:À partir de ×3/2:À partir de ×2;default=1 | gui,launcher
switch | phase_smooth | Régulariser le mouvement entre les images réelles | Interpolation par la couche : répartit le mouvement entre les rafraîchissements prévus des deux images réelles. Réduit le saut lorsque le nombre d'images générées varie (30 i/s sur 144 Hz : alternance ×4 et ×5). Aucun délai supplémentaire. Pris en compte à chaud. |  | gui
switch | catchup_smooth | Rattrapage progressif | Interpolation par la couche : un nouveau créneau perdu ou un léger retard durable peut retirer une sortie à la prochaine paire, en répartissant à nouveau son mouvement. Évite de passer brutalement à la seule image réelle. Les retards avec attente du worker ou un GPU trop lent gardent le rattrapage immédiat. Nécessite la régularisation du mouvement et le cadencement adaptatif. Pris en compte à chaud. |  | gui
switch | vrr_hold | Latence réduite sur écran VRR | Sur un écran à fréquence variable (FreeSync, G-Sync), chaque image s'affiche dès qu'elle est présentée : la retenue de l'image réelle est alors réglée en auto (le plus court que l'écran permet). Sans effet sur un écran à fréquence fixe. Activé par défaut. |  | gui
spin | interp_hold | Retenue de l'image réelle (interpolation) | Fraction de la retenue habituelle de l'image réelle (½ image en ×2). En dessous de 1, les images générées sont affichées plus rapprochées avant la réelle, qui sort plus tôt : moins de latence, cadence moins régulière (le mouvement reste juste). Jamais deux images dans le même rafraîchissement : l'écran fixe le minimum. Mesuré à 40 i/s ×2 sur 144 Hz, 0,5 : image→écran 43 → 38 ms. 1 = images régulières ; −1 = auto : le plus serré que l'écran permet, seulement si le gain dépasse 2 ms (fréquence de l'écran connue). | lo=-1;hi=1;step=0.05;digits=2;default=1 | gui
switch | latency_limiter | Départ d'image au plus tard (anti-lag) | Quand le GPU limite le jeu, retarde le début de l'image suivante du jeu jusqu'à ce que le GPU soit presque libre : le jeu lit ses commandes plus tard pour la même image affichée, comme Reflex ou Anti-Lag (mesuré : image→écran 27 → 18 ms, sans perte de FPS). Sans effet quand le jeu n'est pas limité par le GPU. Activé par défaut. |  | gui
spin | battery_saver | Économie sur batterie | Portable sur batterie : 1 = le profil automatique prend le calcul de mouvement léger (moins de GPU, moins de consommation), quel que soit le GPU ; 2 = et le multiplicateur est plafonné à ×2 ; 0 = désactivé. Bascule toute seule au branchement / débranchement. Jamais sur un Steam Deck (la batterie y est l'état normal). | lo=0;hi=2;step=1;digits=0 | gui,launcher
switch | pacing | Espacement régulier des images | Répartit les images générées dans l'intervalle du jeu (hors vsync FIFO). |  | gui
switch | sync_present | Présentation synchrone (compatibilité) | Bloque le jeu jusqu'à l'affichage de chaque image. Pour certains jeux Direct3D 12 (VKD3D-Proton) qui se figent ; ajoute de la latence. |  | gui

section | motion | Qualité du mouvement | Stabilité, contours, sous-pixel, coupures de scène… | 1 | gui,launcher
switch | online_tune | Réglage automatique par jeu | Pendant les premières secondes de jeu, essaie les options de mouvement et de synthèse sur le jeu lui-même (en notant la prédiction de l'image suivante, la stabilité du mouvement et des images synthétisées à l'aveugle), garde celles qui aident et s'en souvient pour ce jeu ; recommence si le contenu change nettement. Les options réglées à la main ne sont pas touchées. Pris en compte au lancement du jeu. |  | 
spin | zero_bias_contrast | Stabilité adaptée au contraste | Rend la stabilité de l'image fixe relative au contraste : supprime les fondus fantômes sur les décors doux en mouvement rapide, sans déstabiliser le HUD. 0 = désactivé ; 0,02 par défaut. | lo=0;hi=0.5;step=0.01;digits=2 | 
switch | pixel_vectors | Contours d'objets | Choisit le mouvement pixel par pixel aux frontières d'objets : moins de bavures et de halos (+0,3 à +2,9 dB mesurés). Activé d'office sur les GPU dédiés avec le préréglage automatique, tant que la charge reste raisonnable (jusqu'à 4K ×3, 1440p ×5, 1080p ×8) ; ~0,15 ms par image générée en 1440p. |  | 
switch | subpixel | Mouvement sous-pixel | Affine le mouvement au-delà du pixel entier. |  | 
switch | reveal_fill | Extrapolation : zones révélées | Là où un objet en mouvement découvre le décor, prend le fond plutôt que l'objet (celui des deux candidats qui bouge le moins). Images prédites (extrapolation, hybride) ; activé d'office sur les GPU dédiés avec le préréglage automatique. |  | 
spin | hud_mask | Masque de HUD appris | Apprend, pendant les mouvements de caméra, les pixels qui ne changent jamais (HUD, mini-carte, réticule) et les garde tels quels dans les images générées. Nombre d'images stables requis ; 24 conseillé, 0 = désactivé. Activation prise en compte au lancement du jeu. | lo=0;hi=200;step=1;digits=0 | 
spin | subpixel_lk | Sous-pixel précis (Lucas-Kanade) | Affine chaque vecteur par Lucas-Kanade (nombre d'itérations, 2 conseillé) ; ~0,1 ms. En interpolation, à combiner avec l'échantillonnage bicubique. 0 = désactivé. | lo=0;hi=4;step=1;digits=0 | 
switch | synth_bicubic | Échantillonnage bicubique | La synthèse lit les images en Catmull-Rom au lieu de bilinéaire : garde le détail quand le mouvement tombe entre deux pixels (à combiner avec le sous-pixel). ~0,6 ms. |  | 
spin | grad_weight | Netteté du mouvement rapide | Cale le suivi sur les contours plutôt que la seule luminosité : réduit le déchirement en mouvement rapide, au prix d'un peu de fidélité sur l'image fixe. 0 = désactivé ; essayer 1. | lo=0;hi=3;step=0.1;digits=1 | gui
spin | smoothness | Lissage du mouvement | Régularise le champ de mouvement (pénalise les écarts entre blocs voisins). Défaut 0,003. | lo=0;hi=0.03;step=0.001;digits=3 | gui
spin | zero_bias_cap | Plafond de la stabilité | La préférence pour l'immobilité cesse de croître au-delà de quelques pixels : les panoramiques rapides ne se fondent plus en fantôme, le HUD reste stable. 0,006 par défaut ; 0 = sans plafond (ancien comportement). | lo=0;hi=0.03;step=0.001;digits=3 | gui
spin | zero_bias | Stabilité de l'image fixe | Favorise l'absence de mouvement pour garder le HUD parfaitement stable. Défaut 0,003. | lo=0;hi=0.02;step=0.001;digits=3 | gui
spin | search_fine | Précision de recherche | Rayon de recherche fin autour de la prédiction (plus haut = mouvements plus fins, plus coûteux). Défaut 2. | lo=1;hi=4;step=1;digits=0 | gui
spin | flow_iterations | Itérations de synthèse | Raffinements de la recherche du mouvement lors de l'interpolation. Défaut 1. | lo=0;hi=3;step=1;digits=0 | gui
spin | chroma_weight | Couleur dans la recherche du mouvement | Voit les contours entre couleurs de même luminosité (rouge sur vert…), qui sinon se fondent. 0 = désactivé ; essayer 1. Pris en compte au lancement du jeu. | lo=0;hi=8;step=0.5;digits=1 | 
spin | scene_cut_hist | Coupure de scène — preuve par l'histogramme | Une coupure de scène doit aussi changer la distribution des luminosités : le grain, le feuillage ou un mouvement rapide ne déclenchent plus le repli (fondu fantôme ou image dupliquée). 0,05 par défaut ; 0 = le coût du mouvement seul décide. | lo=0;hi=0.5;step=0.01;digits=2 | 
switch | scene_cut_local | Coupure de scène par zone | Décide le repli sur l'image réelle zone par zone : un menu qui s'ouvre sur une partie de l'écran n'est plus déformé (+1,4 dB mesurés, scintillement nettement réduit). Activé d'office sur les GPU dédiés avec le préréglage automatique, comme « Contours d'objets ». |  | 
spin | scene_cut_low | Coupure de scène — début du fondu | Coût de mouvement moyen au-delà duquel on commence à fondre vers l'image réelle. Défaut 0,05. | lo=0;hi=0.3;step=0.01;digits=2 | gui
spin | scene_cut_high | Coupure de scène — image réelle | Coût au-delà duquel l'image générée est remplacée par une vraie image dupliquée. Défaut 0,09. | lo=0;hi=0.5;step=0.01;digits=2 | gui

section | experimental | Expérimental | Options en cours d'évaluation | 1 | gui,launcher
spin | upscale_temporal | Upscaling temporel | Avec une échelle de rendu < 1 et la génération active : les images générées sont calculées à partir des images réelles déjà upscalées (plus nettes), et l'upscale accumule un peu l'image précédente le long du mouvement. 0 = désactivé ; 0,05 conseillé (au-delà de 0,1 l'accumulation floute, faute de jitter du jeu). Pris en compte au lancement du jeu. | lo=0;hi=0.95;step=0.05;digits=2 | 
switch | extrapolate_splat | Extrapolation par projection | Images prédites (extrapolation, hybride) : projette les pixels vers leur position future (moins d'images doubles et de bavures). Activé d'office sur les GPU dédiés avec le préréglage automatique (+0,9 à +1,2 dB mesurés avec « zones révélées »). |  | 
spin | static_guard | Protection du HUD statique | Garde tels quels les pixels identiques dans les deux images quand le mouvement autour bouge (glyphes du HUD). Peut effacer de petits objets très rapides. 0 = désactivé. | lo=0;hi=1;step=0.1;digits=1 | 
switch | global_motion | Mouvement de la caméra | Cherche le décalage d'ensemble de l'image (rotation rapide de la caméra) bien au-delà de la portée habituelle, comme second point de départ pour chaque bloc : l'image ne se défait plus pendant un mouvement de souris rapide. Mesuré sur de vrais jeux en 1440p : 17 à 19 % de pixels grossièrement faux en moins, rien de perdu ailleurs, ~0,05 ms. Activé d'office sur les GPU dédiés. |  | 
switch | temporal_prediction | Prédiction temporelle | Cherche le mouvement autour de celui de l'image précédente : suit les panoramiques très rapides (surtout avec « Stabilité adaptée au contraste »). Activé d'office sur les GPU dédiés avec le préréglage automatique (sans coût GPU). |  | 
spin | occlusion_strength | Gestion des occlusions | Confiance aller/retour du mouvement dans la synthèse. 0 = désactivé. | lo=0;hi=1;step=0.1;digits=1 | 
spin | rot_weight | Rotation / zoom | Réévalue les correspondances ambiguës sous rotation et mise à l'échelle. 0 = désactivé, 1 = activé. | lo=0;hi=1;step=1;digits=0 | 
spin | census_weight | Recherche par structure (census) | Départage les correspondances ambiguës par la structure locale. 0 = désactivé. | lo=0;hi=8;step=0.1;digits=1 | 
spin | census_margin | Seuil d'ambiguïté (census) | Écart relatif en dessous duquel une correspondance est jugée ambiguë. Défaut 0,05. | lo=0;hi=1;step=0.01;digits=2 | 
spin | extrapolate_accel | Extrapolation : accélération | Prédit des trajectoires courbes (caméra qui accélère, freine ou se retourne) au lieu d'une vitesse constante. 0 = désactivé, 1 = plein effet. | lo=0;hi=1;step=0.1;digits=1 | 
spin | flow_temporal | Stabilisation temporelle du mouvement | Garde le mouvement de la paire précédente là où il explique aussi bien la nouvelle paire (zones plates, textures répétées) : moins de scintillement. 0 = désactivé, 1 = conseillé. | lo=0;hi=1;step=0.1;digits=1 | 

section | flow | Structure du flux | Résolution et pyramide du calcul du mouvement — désactive l'auto-réglage | 1 | gui,launcher
choice | flow_scale | Résolution du flux | Diviseur de résolution du calcul du mouvement ; « Auto » vise ~0,5 Mpixel. | choices=auto:Auto/1:Pleine (1)/2:Moitié (2)/4:Quart (4);default=auto | 
spin | levels | Niveaux de pyramide | Plus de niveaux = mouvements plus amples suivis. Défaut 4. | lo=1;hi=6;step=1;digits=0 | 
spin | search_radius | Rayon de recherche grossier | Rayon de recherche au niveau le plus grossier. Défaut 4. | lo=1;hi=4;step=1;digits=0 | 
switch | refine | Raffinement 4×4 | Meilleurs contours du mouvement ; coûte du temps GPU. |  | 
switch | refine_all | Raffiner tous les niveaux | Désactivé : seulement le plus fin (moins cher, ~2 dB moins bon). |  | 
spin | refine_bias | Préférence pour le mouvement du bloc | Bonus pour garder le mouvement propre d'un bloc lors du raffinement. Défaut 0,5. | lo=0;hi=5;step=0.1;digits=1 | 

section | diagnostic | Diagnostic | Journal, statistiques, profilage, captures d'images | 0 | gui,launcher
choice | debug | Mode de débogage | Flux : colore le mouvement estimé. Écran partagé : moitié générée / moitié réelle. Transparent : aucune génération (isole un problème). | choices=none:Aucun/flow:Flux/split:Écran partagé/passthrough:Transparent;default=none | 
choice | log | Verbosité du journal |  | choices=0:Silencieux (0)/1:Avertissements (1)/2:Infos (2)/3:Débogage (3);default=1 | gui
text | log_file | Fichier journal | Chemin du fichier de log (vide = sortie standard). ~ accepté. | default= | gui
switch | stats | Statistiques de FPS dans le journal |  |  | gui
spin | stats_interval | Intervalle des statistiques (s) |  | lo=0.5;hi=60;step=0.5;digits=1 | gui
switch | profile | Profilage GPU | Temps GPU par étape, avec les statistiques. |  | gui
text | dump | Dossier de capture d'images | Écrit les images présentées en PPM dans ce dossier (vide = désactivé). À éviter dans /tmp. | default= | gui
spin | dump_frames | Nombre d'images capturées |  | lo=1;hi=100000;step=1;digits=0 | gui

section | compat | Compatibilité | Réglages de secours pour les jeux récalcitrants | 0 | gui
switch | hide_present_ext | Masquer les extensions de présentation | Cache swapchain_maintenance1 / present_id au jeu (nécessaire pour VKD3D-Proton). |  | 
switch | present_queue | Présentation sur une file GPU séparée | Copie et présente les images sur une file GPU à part de celle de la synthèse : la présentation n'attend plus la synthèse de l'image suivante (images générées réellement affichées quand le GPU est chargé). |  | 
switch | synth_priority | Priorité GPU haute pour la synthèse | Avec la file de calcul asynchrone : demande au pilote une priorité haute pour la synthèse, devant l'image suivante d'un jeu limité par le GPU. Accordée seulement aux processus privilégiés (NVIDIA et amdgpu la refusent sinon : priorité normale). Pris en compte au lancement du jeu. |  | 
switch | flow_confidence | Mesurer la confiance du flux | Évalue, pour chaque zone, si le mouvement estimé est fiable (aller-retour des vecteurs, correspondance de luminosité) : la part d'image incertaine s'affiche dans l'état du jeu et le rapport ; debug=confidence la montre en rouge. Pris en compte au lancement du jeu. |  | 
switch | interp_splat | Projection des deux images (interpolation) | Projette chaque pixel des deux images vers l'instant de l'image générée et essaie ces trajectoires : au bord d'un objet, le bon plan (devant ou derrière) est trouvé plus souvent. Mesuré : occlusions +0,2 à +0,6 dB, texte qui défile +0,4 à +0,7. Activé d'office sur GPU dédié. |  | 
switch | parallax_search | Recherche de parallaxe (rambardes, poteaux) | Dans un déplacement latéral, les structures fines proches (poteaux d'une rambarde, grilles, piliers) défilent plus vite que le décor et la recherche de mouvement leur donne celui du fond : elles se cassent dans les images générées. Essaie des multiples du mouvement là où il explique mal l'image, gardés seulement si les deux sens concordent. Mesuré : rambarde ×4 +0,32 dB, scintillement −0,21, ailleurs neutre ; coûte ~0,3 ms de GPU par image du jeu en 1440p (sur la latence). Désactivé par défaut. |  | 
spin | learned_flow | Flux corrigé par réseau (expérimental) | Un petit réseau corrige chaque vecteur du mouvement (au plus 1,5 pixel) : zooms, mouvements sous-pixel et fondus mieux suivis. Entraîné sur des mouvements de synthèse ; mesuré : zoom +1,2 à +2,6 dB, sous-pixel +0,5 à +2,2, démo neutre, petites pertes sur une rotation ; environ +0,3 ms par image générée en 1440p. 0 = désactivé (défaut), 1 = toute la correction. | lo=0;hi=1;step=0.25;digits=2 | 
spin | luma_match | Compensation des changements de luminosité | Avant le calcul du mouvement, ramène l'image précédente à la luminosité de la courante quand toute l'image s'éclaircit ou s'assombrit (fondus, éclairages qui varient) : le mouvement reste trouvé. Mesuré : +6 à +8 dB sur ces scènes, rien ne change ailleurs. 0 = désactivé. | lo=0;hi=0.1;step=0.005;digits=3 | 
spin | learned_correction | Correction apprise (expérimental) | Un petit réseau entraîné hors ligne rapproche du fondu les pixels générés dont le voisinage trahit une erreur. Mesuré : +0,5 dB sur la démo, mais jusqu'à −1,7 dB sur des contenus qu'il n'a pas vus à l'entraînement ; à réentraîner sur ses propres jeux (tools/train_correction.py). 0 = désactivé. | lo=0;hi=1;step=0.1;digits=1 | 
switch | crash_log | Journal de plantage | Si la couche plante, écrit ~/.cache/bdex-framegen/crash-<jeu>-<pid>.txt (signal, emplacement dans la couche, réglages), repris par bdex-framegen --report. Ne touche à aucune autre faute du jeu (Wine/Proton gardent les leurs). Pris en compte au lancement du jeu. |  | 
switch | shared_queue | File GPU partagée avec le jeu | Force le layer à partager la file du jeu (test / pilotes sans file libre). |  | 

section | capture | Capture Windows | Réglages propres à l'app de capture | 0 | launcher
choice | capture_hdr | Couleur HDR (écrans HDR) | Auto : HDR (scRGB) quand l'écran du jeu est en HDR. | choices=auto:Auto (selon l'écran)/0:Toujours SDR/1:HDR si possible;default=auto | 
