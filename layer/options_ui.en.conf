# English texts of layer/options_ui.conf (the GTK panel and the Windows
# launcher show them when the system language is not French). Every section
# and option there needs its line here — the build fails otherwise.
#
#   section | id | title | subtitle
#   option  | key | label | help | choices (value:Label/value:Label, the same values)

section | cadence | Pacing | FPS limit, automatic multiplier, smoothness
option | fps_limit | Game frame limit | Caps the game's frame rate (0 = none). A steady base that divides the refresh rate (60 → 120 Hz, 72 → 144 Hz) gives the smoothest generation. −1 = auto: measured refresh rate ÷ multiplier (fixed-refresh screens). |
option | target_fps | Automatic multiplier — target | The refresh rate to aim for (e.g. 144): the largest multiplier that stays under the target (at 144: 72 → ×2, 50 → ×2, 48 → ×3, 36 → ×4, ×1 from 74), never above the multiplier chosen. 0 = fixed multiplier; −1 = auto (the screen's refresh rate). The multiplier's « Auto » choice sets −1. |
option | present_feedback | Measure what is really displayed | Measures when each frame really reaches the screen (if the driver allows it): refresh rate, replaced frames, pacing locked to the screen. |
option | x11_clock | X11 display clock | X11 windows, every Proton game on Wayland (Xwayland) included: the screen's timing is read from the X server (Present events) where the display measurement finds none. Frames are then presented for the compositor's real refreshes instead of a grid of our own. On by default; applies when the game starts. |
option | present_timing | Display timestamps from the driver | With the measure of what is displayed: when each frame appears, timed by the driver (VK_EXT_present_timing, if it has it), and the exact refresh duration — more precise than the moment a waiting thread wakes. On by default. |
option | frame_timing | Follow the frames' real timing | Places each generated frame by the real time of the game's frames rather than at fixed intervals: less stutter when the frame time varies. May cost a little in games with a fixed simulation step. |
option | dedup | Detect repeated frames | Finds the frames a game presents twice (30 fps cutscenes, emulators): keeps the previous motion instead of freezing the picture. Applies when the game starts. |
option | gpu_budget | GPU budget of the generation | Share of the game's frame time the generation may take (0.25 = a quarter); above it the quality steps down, then back up. 0 = off. |
option | max_frame_latency | Maximum latency (frames ahead) | How many frames the GPU may still be working on when the game starts the next one, like drivers' « low latency mode »: 1 = the game waits for the GPU to finish the previous frame before it reads its input. Cuts the input lag of GPU-bound games sharply (measured: −28 %), with no measured FPS loss. 1 by default; 0 = no limit. |
option | skip_fast | No generation when it is useless | With a fixed multiplier: once the game reaches 85 % of the screen's refresh rate (130 fps on 144 Hz), generation pauses — it would add almost no frame to the screen, only GPU work and latency — and resumes below 75 %. No effect when the refresh rate is unknown. On by default. |
option | battery_saver | Battery saver | Laptop on battery: 1 = the automatic preset takes the light motion flow (less GPU, less power), whatever the GPU; 2 = and the multiplier is capped at x2; 0 = off. Switches by itself when plugged in or out. Never on a Steam Deck (the battery is its normal state). |
option | refresh_fill | Fill every refresh | Layer interpolation on a fixed-refresh screen: follow the screen rate with as many frames as needed, within the available outputs. At 30 fps on 144 Hz: alternate ×4 and ×5; around 36–37 fps: ×3 and ×4, to avoid exceeding the screen and replacing frames. The selected multiplier is a ceiling, with one extra output if needed (8 maximum). Inactive if fewer than two outputs per game frame suffice, or the ceiling cannot fill the screen. | 0:No/1:From ×3/2:From ×2
option | phase_smooth | Smooth motion between real frames | Layer interpolation: spread motion between the two real frames' scheduled refreshes. Reduces the jump when the number of generated frames changes (30 fps on 144 Hz alternates ×4 and ×5). No additional delay. Applied live. |
option | catchup_smooth | Gradual catch-up | Layer interpolation: a newly missed refresh or a persistent small backlog can remove one output from the next pair while re-spacing its movement. Avoids jumping straight to the real frame. Worker pressure or a slow GPU still use immediate recovery. Requires motion smoothing and adaptive pacing. Applied live. |
option | vrr_hold | Lower latency on VRR screens | On a variable-refresh screen (FreeSync, G-Sync), each frame shows as soon as it is presented: the real frame's hold is then set to auto (the shortest the screen allows). No effect on a fixed-refresh screen. On by default. |
option | interp_hold | Real frame hold (interpolation) | Fraction of the usual hold of the real frame (half a frame at ×2). Below 1, the generated frames are shown closer together before the real one, which comes out sooner: less latency, less even pacing (the motion stays right). Never two frames in the same refresh: the screen sets the minimum. Measured at 40 fps ×2 on 144 Hz, 0.5: frame-to-screen 43 → 38 ms. 1 = even frames; −1 = auto: the tightest the screen allows, only when it gains more than 2 ms (known refresh rate). |
option | latency_limiter | Start frames as late as possible (anti-lag) | When the GPU limits the game, delays the start of the game's next frame until the GPU is almost free: the game reads its input later for the same frame on screen, like Reflex or Anti-Lag (measured: frame-to-screen 27 → 18 ms, no FPS loss). No effect when the game is not GPU-bound. On by default. |
option | pacing | Even frame spacing | Spreads the generated frames over the game's frame interval (except with FIFO vsync). |
option | sync_present | Synchronous presentation (compatibility) | Blocks the game until each frame is displayed. For some Direct3D 12 games (VKD3D-Proton) that freeze; adds latency. |

section | motion | Motion quality | Stability, edges, sub-pixel, scene cuts…
option | online_tune | Automatic tuning per game | During the first seconds of play, tries the motion and synthesis options on the game itself (rating the prediction of the next frame, the stability of the motion and frames synthesized blind), keeps those that help and remembers them for this game; starts again if the content changes clearly. Options set by hand are left alone. Applies when the game starts. |
option | zero_bias_contrast | Contrast-aware stability | Makes the still-picture stability relative to the contrast: removes the ghostly blends on soft scenery in fast motion, without making the HUD unstable. 0 = off; 0.02 by default. |
option | pixel_vectors | Object edges | Chooses the motion pixel by pixel at object boundaries: less smearing and fewer halos (+0.3 to +2.9 dB measured). On by default on discrete GPUs with the automatic preset, as long as the load stays reasonable (up to 4K ×3, 1440p ×5, 1080p ×8); ~0.15 ms per generated frame at 1440p. |
option | subpixel | Sub-pixel motion | Refines the motion beyond the whole pixel. |
option | reveal_fill | Extrapolation: revealed areas | Where a moving object uncovers the background, takes the background rather than the object (whichever of the two candidates moves least). Predicted frames (extrapolation, hybrid); on by default on discrete GPUs with the automatic preset. |
option | hud_mask | Learned HUD mask | Learns, during camera motion, the pixels that never change (HUD, minimap, crosshair) and keeps them as they are in the generated frames. Stable frames required; 24 advised, 0 = off. Turning it on applies when the game starts. |
option | subpixel_lk | Precise sub-pixel (Lucas-Kanade) | Refines each vector with Lucas-Kanade (iterations, 2 advised); ~0.1 ms. In interpolation, combine it with bicubic sampling. 0 = off. |
option | synth_bicubic | Bicubic sampling | The synthesis reads the frames with Catmull-Rom instead of bilinear sampling: keeps the detail when the motion falls between two pixels (combine it with sub-pixel motion). ~0.6 ms. |
option | grad_weight | Sharp fast motion | Locks the tracking onto edges rather than brightness alone: less tearing in fast motion, at the cost of some fidelity on still pictures. 0 = off; try 1. |
option | smoothness | Motion smoothing | Regularizes the motion field (penalizes differences between neighbouring blocks). Default 0.003. |
option | zero_bias_cap | Stability cap | The preference for stillness stops growing beyond a few pixels: fast pans no longer blend into ghosts, the HUD stays stable. 0.006 by default; 0 = no cap (the old behaviour). |
option | zero_bias | Still-picture stability | Favours no motion to keep the HUD perfectly still. Default 0.003. |
option | search_fine | Search precision | Fine search radius around the prediction (higher = finer motion, more costly). Default 2. |
option | flow_iterations | Synthesis iterations | Refinements of the motion search during interpolation. Default 1. |
option | chroma_weight | Colour in the motion search | Sees the edges between colours of the same brightness (red on green…), which otherwise blend. 0 = off; try 1. Applies when the game starts. |
option | scene_cut_hist | Scene cut — histogram evidence | A scene cut must also change the distribution of brightness: grain, foliage or fast motion no longer trigger the fallback (ghostly blend or duplicated frame). 0.05 by default; 0 = the motion cost alone decides. |
option | scene_cut_local | Scene cut per area | Decides the fallback to the real frame area by area: a menu opening on part of the screen is no longer warped (+1.4 dB measured, much less flicker). On by default on discrete GPUs with the automatic preset, like « Object edges ». |
option | scene_cut_low | Scene cut — blend start | Mean motion cost above which the frame starts blending toward the real one. Default 0.05. |
option | scene_cut_high | Scene cut — real frame | Cost above which the generated frame is replaced by a duplicated real one. Default 0.09. |

section | experimental | Experimental | Options under evaluation
option | upscale_temporal | Temporal upscaling | With a render scale below 1 and generation on: the generated frames are computed from the real frames already upscaled (sharper), and the upscaler accumulates a little of the previous frame along the motion. 0 = off; 0.05 advised (above 0.1 the accumulation blurs, as the game has no jitter). Applies when the game starts. |
option | extrapolate_splat | Extrapolation by projection | Predicted frames (extrapolation, hybrid): projects the pixels to their future position (fewer double images and smears). On by default on discrete GPUs with the automatic preset (+0.9 to +1.2 dB measured with « revealed areas »). |
option | static_guard | Static HUD protection | Keeps as they are the pixels identical in both frames when the motion around them moves (HUD glyphs). May erase small, very fast objects. 0 = off. |
option | global_motion | Camera motion | Searches the picture's overall shift (a fast camera turn) far beyond the usual reach, as a second starting point for each block: the picture no longer breaks up during a fast mouse turn. Measured on real games at 1440p: 17 to 19 % fewer grossly wrong pixels, nothing lost elsewhere, ~0.05 ms. On by default on discrete GPUs. |
option | temporal_prediction | Temporal prediction | Searches the motion around the previous frame's: follows very fast pans (above all with « Contrast-aware stability »). On by default on discrete GPUs with the automatic preset (no GPU cost). |
option | occlusion_strength | Occlusion handling | Forward/backward confidence of the motion in the synthesis. 0 = off. |
option | rot_weight | Rotation / zoom | Re-rates ambiguous matches under rotation and scaling. 0 = off, 1 = on. |
option | census_weight | Structure search (census) | Settles ambiguous matches by the local structure. 0 = off. |
option | census_margin | Ambiguity threshold (census) | Relative difference below which a match counts as ambiguous. Default 0.05. |
option | extrapolate_accel | Extrapolation: acceleration | Predicts curved trajectories (a camera that speeds up, brakes or turns) instead of a constant speed. 0 = off, 1 = full effect. |
option | flow_temporal | Temporal motion stabilization | Keeps the previous pair's motion where it explains the new pair as well (flat areas, repeated textures): less flicker. 0 = off, 1 = advised. |

section | flow | Flow structure | Resolution and pyramid of the motion computation — turns automatic tuning off
option | flow_scale | Flow resolution | Resolution divisor of the motion computation; « Auto » aims at ~0.5 Mpixel. | auto:Auto/1:Full (1)/2:Half (2)/4:Quarter (4)
option | levels | Pyramid levels | More levels = wider motion followed. Default 4. |
option | search_radius | Coarse search radius | Search radius at the coarsest level. Default 4. |
option | refine | 4×4 refinement | Better motion edges; costs GPU time. |
option | refine_all | Refine every level | Off: only the finest (cheaper, ~2 dB worse). |
option | refine_bias | Preference for the block's motion | Bonus for keeping a block's own motion during refinement. Default 0.5. |

section | diagnostic | Diagnostics | Log, statistics, profiling, frame captures
option | debug | Debug mode | Flow: colours the estimated motion. Split screen: half generated / half real. Pass-through: no generation (isolates a problem). | none:None/flow:Flow/split:Split screen/passthrough:Pass-through
option | log | Log verbosity |  | 0:Quiet (0)/1:Warnings (1)/2:Info (2)/3:Debug (3)
option | log_file | Log file | Path of the log file (empty = standard output). ~ accepted. |
option | stats | FPS statistics in the log |  |
option | stats_interval | Statistics interval (s) |  |
option | profile | GPU profiling | GPU time per stage, with the statistics. |
option | dump | Frame capture folder | Writes the presented frames as PPM into this folder (empty = off). Avoid /tmp. |
option | dump_frames | Frames captured |  |

section | compat | Compatibility | Fallback settings for stubborn games
option | hide_present_ext | Hide the presentation extensions | Hides swapchain_maintenance1 / present_id from the game (needed by VKD3D-Proton). |
option | present_queue | Presentation on a separate GPU queue | Copies and presents the frames on a GPU queue apart from the synthesis's: the presentation no longer waits for the next frame's synthesis (generated frames really displayed when the GPU is loaded). |
option | synth_priority | High GPU priority for the synthesis | With the asynchronous compute queue: asks the driver for a high priority for the synthesis, ahead of the next frame of a GPU-bound game. Granted only to privileged processes (NVIDIA and amdgpu refuse it otherwise: normal priority). Applies when the game starts. |
option | flow_confidence | Measure the flow's confidence | Rates, for each area, whether the estimated motion is reliable (vectors there and back, brightness match): the uncertain share of the picture shows in the game's status and the report; debug=confidence shows it in red. Applies when the game starts. |
option | interp_splat | Projection of both frames (interpolation) | Projects each pixel of both frames to the time of the generated frame and tries those trajectories: at an object's edge, the right layer (in front or behind) is found more often. Measured: occlusions +0.2 to +0.6 dB, scrolling text +0.4 to +0.7. On by default on discrete GPUs. |
option | parallax_search | Parallax search (railings, posts) | In a sideways move, thin near structures (a railing's posts, fences, pillars) pass faster than the scenery and the motion search gives them the background's motion: they break up in the generated frames. Tries multiples of the motion where it explains the picture poorly, kept only where both directions agree. Measured: railing x4 +0.32 dB, flicker −0.21, neutral elsewhere; costs ~0.3 ms of GPU a game frame at 1440p (on the latency path). Off by default. |
option | learned_flow | Flow corrected by a network (experimental) | A small network corrects each motion vector (by at most 1.5 pixels): zooms, sub-pixel motion and fades followed better. Trained on synthetic motions; measured: zoom +1.2 to +2.6 dB, sub-pixel +0.5 to +2.2, demo neutral, small losses on a rotation; about +0.3 ms a generated frame at 1440p. 0 = off (default), 1 = the whole correction. |
option | luma_match | Brightness change compensation | Before the motion computation, brings the previous frame to the current one's brightness when the whole picture brightens or darkens (fades, changing lights): the motion is still found. Measured: +6 to +8 dB on those scenes, nothing changes elsewhere. 0 = off. |
option | learned_correction | Learned correction (experimental) | A small network trained offline pulls toward the blend the generated pixels whose neighbourhood gives away an error. Measured: +0.5 dB on the demo, but down to −1.7 dB on content it did not see in training; retrain it on your own games (tools/train_correction.py). 0 = off. |
option | crash_log | Crash log | If the layer crashes, writes ~/.cache/bdex-framegen/crash-<game>-<pid>.txt (signal, location in the layer, settings), included by bdex-framegen --report. Touches no other fault of the game (Wine/Proton keep theirs). Applies when the game starts. |
option | shared_queue | GPU queue shared with the game | Makes the layer share the game's queue (testing / drivers without a free queue). |

section | capture | Windows capture | Settings of the capture app
option | capture_hdr | HDR colour (HDR screens) | Auto: HDR (scRGB) when the game's screen is in HDR. | auto:Auto (from the screen)/0:Always SDR/1:HDR when possible
