# bdex-framegen — per-game profiles shipped with the layer.
#
# Loaded before your own config file (~/.config/bdex-framegen.conf, or
# %APPDATA%\bdex-framegen\bdex-framegen.conf on Windows), which overrides
# anything here; BDEX_FG_* environment variables override both. Sections are
# executable names without ".exe" (lower case), as in your own file. These
# profiles only tune a game: they never enable the layer ("enabled") or pause
# it, and a [*] section here is ignored. Multiplayer games protected by an
# anti-cheat (EAC, BattlEye, GameGuard, XIGNCODE3, PunkBuster, miHoYo) are
# detected at startup and left untouched whatever the configuration says.
#
# Add a game only with settings verified on it (say how in a comment).

# Kenshi (Steam 233860, DX11 through DXVK). Validated 2026-09-13/14 on a
# Vega 8 at ~33-40 fps: extrapolation showed very visible artefacts,
# interpolation none, and the added latency was acceptable at that frame rate.
[kenshi_x64]
mode = interpolate
